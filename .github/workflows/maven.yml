# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests --file pom.xml
    - name: Official SonarQube Scan
      # You may pin to the exact commit or the version.
      # uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
      uses: SonarSource/sonarqube-scan-action@v8.4.1
      with:
        projectBaseDir: .
        # Version of the Sonar Scanner CLI to use   
    - name: SonarQube Quality Gate Check
      # You may pin to the exact commit or the version.
      # uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
      with:
        # Location of the scanner metadata report file
        scanMetadataReportFile: # optional, default is .scannerwork/report-task.txt
        # The maximum time (in seconds) to poll for SonarQube's Quality Gate status. Default: 300.
        pollingTimeoutSec: # optional, default is 300

  
